<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hurtigrenovering</title>
<style>
  :root { --bg:#f4f4f2; --card:#ffffff; --ink:#202020; --muted:#5f5f5f; --line:#d6d6d2; --accent:#202020; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --card:#222222; --ink:#f2f2f2; --muted:#b0b0b0; --line:#3a3a3a; --accent:#f2f2f2; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font-family: Arial, Helvetica, sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.4; }
  label { display:block; font-size:13px; font-weight:bold; margin-bottom:6px; }
  input[type=password] { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); }
  .row { display:flex; align-items:center; gap:8px; margin:12px 0 16px; font-size:14px; color:var(--muted); }
  button { width:100%; font-size:16px; font-weight:bold; padding:11px; border:0; border-radius:8px; background:var(--accent); color:var(--card); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:12px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Hurtigrenovering</h1>
  <p>Intern side. Skriv inn koden for å åpne.</p>
  <label for="pw">Kode</label>
  <input type="password" id="pw" required autofocus>
  <div class="row"><input type="checkbox" id="rem"><label for="rem" style="font-weight:normal;margin:0">Husk meg på denne enheten i 30 dager</label></div>
  <button id="btn" type="submit">Åpne</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const KEYNAME = 'hurtig_key';
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function show(key) {
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(KEYNAME) || 'null');
    if (saved && saved.salt === DATA.salt && saved.exp > Date.now()) {
      const key = await crypto.subtle.importKey('raw', b64(saved.k), {name:'AES-GCM'}, true, ['decrypt']);
      await show(key); return;
    }
    if (saved) localStorage.removeItem(KEYNAME);
  } catch (e) { try { localStorage.removeItem(KEYNAME); } catch (e2) {} }
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Åpner …'; err.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) {
      try {
        const raw = await crypto.subtle.exportKey('raw', key);
        localStorage.setItem(KEYNAME, JSON.stringify({k: toB64(raw), salt: DATA.salt, exp: Date.now() + 30*24*3600*1000}));
      } catch (e) {}
    }
    await show(key);
  } catch (e) {
    try { localStorage.removeItem(KEYNAME); } catch (e2) {}
    err.textContent = 'Feil kode – prøv igjen.';
    btn.disabled = false; btn.textContent = 'Åpne';
  }
});
